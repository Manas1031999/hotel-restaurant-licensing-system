# Application Configuration
spring.application.name=wb-nhls
server.port=8080
# শুধু বিশ্বস্ত proxy-র X-Forwarded-For মানা হবে
server.forward-headers-strategy=native

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/wb_nhls
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2


nhls.license.renewal-fee=2000.00

# JWT (HS256, secret কমপক্ষে 32 অক্ষর)
nhls.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
nhls.jwt.expiry-minutes=60

# প্রথম চালুতে এই ADMIN তৈরি হবে
nhls.admin.username=${ADMIN_USERNAME:admin}
nhls.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Mail (local-এ Mailpit: SMTP 1025, UI http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.default-encoding=UTF-8

# Notification outbox
nhls.notification.from=noreply@nhls.local
nhls.notification.poll-interval-ms=10000
nhls.notification.batch-size=20
nhls.notification.max-attempts=5
